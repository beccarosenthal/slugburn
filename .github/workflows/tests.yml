name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No install step: package.json has no dependencies and there is no build.
      # tests/run.js exits 1 when anything fails, so a red suite fails the job.
      - name: Run tests
        run: node tests/run.js
