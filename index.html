<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slugburn</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>SLUG<span>BURN</span></h1>

    <div id="stage">
      <canvas id="game"></canvas>
      <div id="banner">
        <div id="banner-text"></div>
        <div id="banner-sub"></div>
      </div>
    </div>

    <div id="hud">
      <div class="seat p1">
        <b>CYAN</b>
        <select id="ctrl-p1" aria-label="Cyan controller"></select>
        <span class="keys" id="keys-p1">W A S D</span>
        <p class="blurb" id="blurb-p1"></p>
      </div>

      <button id="restart">RESTART (R)</button>

      <div class="seat p2">
        <b>MAGENTA</b>
        <select id="ctrl-p2" aria-label="Magenta controller"></select>
        <span class="keys" id="keys-p2">ARROW KEYS</span>
        <p class="blurb" id="blurb-p2"></p>
      </div>
    </div>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
